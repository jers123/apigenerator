spring.application.name=apigenerator
server.port=8080
app.version=@project.version@
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Consulta de versiones en Maven Central
app.versions.repository-url=https://repo.maven.apache.org/maven2/
app.versions.cache-ttl=PT6H
app.versions.connect-timeout=PT5S
app.versions.read-timeout=PT10S

# Carpeta de datos editables por el usuario (motores de base de datos, catálogo, etc.)
app.data-dir=${user.home}/.apigenerator
app.databases.defaults=classpath:defaults/databases.json
app.catalog.defaults=classpath:catalog/dependency-catalog.json
app.security.defaults=classpath:defaults/security.json
app.identity-providers.defaults=classpath:defaults/identity-providers.json

# Grupos del catálogo que el modelo agrega solos al proyecto
app.model.persistence-group=spring-data
app.model.validation-group=validation